<template id="t-how">
<pre><span class="c">starts   </span><span class="dim">a random 32-byte key from your crypto RNG feeds ChaCha12; each GPU thread takes one block
         as a private key k and computes k·G once</span>
<span class="c">keys     </span><span class="dim">then it walks k ± j with affine additions of precomputed j·G: 65 keys share one field
         inversion (Montgomery's trick); after 4160 keys it takes a fresh random start</span>
<span class="c">address  </span><span class="dim">Keccak-256(X‖Y) → 0x41 ‖ last 20 bytes → double SHA-256 checksum → base58, all on the GPU</span>
<span class="c">matching </span><span class="dim">prefixes are filtered on the top bits; for a suffix of 6+ characters the needed checksum
         follows from the address, so the double SHA-256 is skipped for almost every key</span>
<span class="c">checking </span><span class="dim">every match is recomputed with a separate, plain secp256k1 before it is shown</span>
<span class="c">odds     </span><span class="dim">each extra character is ~58× rarer; every address starts with T and the second character
         is one of A–Z (no I, O); -i (any case) helps a lot</span>
<span class="c">import   </span><span class="dim">TronLink → Import wallet → Private key (64 hex characters)</span>
<span class="c">safety   </span><span class="dim">for an address that will hold real money, use the native app on an offline machine</span>
